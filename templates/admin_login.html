<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protogen Admin — Вход</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin-page">

<div class="admin-glow"></div>

<div class="login-card">
    <div class="login-logo">🐾</div>
    <div class="login-badge">PROTOGEN ADMIN</div>
    <h1>Вход в систему</h1>
    <p class="login-subtitle">Закрытая панель управления ботом</p>

    {% if error %}
        <div class="login-error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="post" class="login-form">
        <label>Логин</label>
        <input name="username" type="text" autocomplete="username" required>

        <label>Пароль</label>
        <input name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Войти в панель <span>→</span></button>
    </form>

    <a class="back-link" href="/">← Вернуться на сайт</a>
</div>

</body>
</html>
