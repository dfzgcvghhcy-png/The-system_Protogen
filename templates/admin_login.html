<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Protogen System — Authorization</title>
  <style>
    *{box-sizing:border-box}
    :root{--cyan:#00ffe1;--purple:#9b45ff;--green:#00ff9c}
    html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;color:#efffff}
    body{
      min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden;
      background:
        linear-gradient(180deg,rgba(1,4,8,.62),rgba(1,5,9,.88)),
        url("/static/bg.png") center/cover fixed;
    }
    body:before{
      content:"";position:fixed;inset:-10%;pointer-events:none;
      background:
        radial-gradient(circle at 50% 45%,rgba(0,255,225,.12),transparent 22%),
        radial-gradient(circle at 65% 30%,rgba(155,69,255,.14),transparent 28%);
      animation:drift 8s ease-in-out infinite alternate;
    }
    .scan{
      position:fixed;inset:0;pointer-events:none;opacity:.035;
      background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px);
    }
    .auth{
      width:min(440px,100%);position:relative;padding:30px;border-radius:22px;
      border:1px solid rgba(0,255,225,.25);
      background:linear-gradient(145deg,rgba(3,14,20,.93),rgba(4,7,15,.91));
      box-shadow:0 0 70px rgba(0,255,225,.10),0 30px 100px rgba(0,0,0,.5);
      backdrop-filter:blur(20px);z-index:1;
    }
    .auth:before{
      content:"";position:absolute;left:20px;right:20px;top:0;height:1px;
      background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);
    }
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
    .avatar{width:50px;height:50px;border-radius:15px;overflow:hidden;border:1px solid var(--cyan);
      box-shadow:0 0 20px rgba(0,255,225,.18)}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .brand strong{display:block;font-size:15px;letter-spacing:.6px}
    .brand span{display:block;color:var(--cyan);font-size:8px;letter-spacing:2px;margin-top:4px}
    .kicker{color:var(--cyan);font-size:8px;letter-spacing:2.5px;font-weight:900}
    h1{font-size:27px;margin:8px 0 6px}
    .sub{color:#708889;font-size:11px;line-height:1.6;margin:0 0 23px}
    label{display:block;color:#91aaab;font-size:9px;letter-spacing:.8px;margin:0 0 7px}
    .field{margin-bottom:14px}
    input{
      width:100%;padding:13px 14px;border-radius:11px;
      border:1px solid rgba(0,255,225,.13);background:#061014;color:#fff;outline:none;
      font-size:12px;
    }
    input:focus{border-color:rgba(0,255,225,.65);box-shadow:0 0 0 3px rgba(0,255,225,.05)}
    button{
      width:100%;border:0;border-radius:11px;padding:13px;margin-top:4px;
      background:linear-gradient(90deg,var(--cyan),#48f6e9);color:#00100f;
      font-weight:900;cursor:pointer;letter-spacing:.4px;
      box-shadow:0 0 24px rgba(0,255,225,.15);transition:.2s;
    }
    button:hover{filter:brightness(1.08);transform:translateY(-1px)}
    .error{
      margin:0 0 14px;padding:10px;border-radius:9px;
      border:1px solid rgba(255,90,120,.28);background:rgba(255,60,100,.06);
      color:#ff8da0;font-size:10px;
    }
    .secure{
      margin-top:18px;padding-top:15px;border-top:1px solid rgba(255,255,255,.05);
      color:#526b6d;text-align:center;font-size:8px;letter-spacing:.7px;
    }
    .secure b{color:#4ee7bd}
    .back{display:block;text-align:center;color:#60797a;text-decoration:none;font-size:9px;margin-top:14px}
    .back:hover{color:var(--cyan)}
    @keyframes drift{from{transform:translate(-1%,-1%) scale(1)}to{transform:translate(1%,1%) scale(1.04)}}
  </style>
</head>
<body>
  <div class="scan"></div>
  <main class="auth">
    <div class="brand">
      <div class="avatar"><img src="/static/my_avatar.png" alt="Protogen"></div>
      <div>
        <strong>PROTOGEN SYSTEM</strong>
        <span>SECURE ADMIN CONSOLE</span>
      </div>
    </div>

    <div class="kicker">ADMIN ACCESS // AUTHORIZATION</div>
    <h1>Вход в систему</h1>
    <p class="sub">Административная панель закрыта. Введи свои учётные данные для продолжения.</p>

    {% if error %}
      <div class="error">⚠ {{ error }}</div>
    {% endif %}

    <form method="post" autocomplete="on">
      <div class="field">
        <label for="username">ЛОГИН</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>

      <div class="field">
        <label for="password">ПАРОЛЬ</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button type="submit">ВОЙТИ В PROTOGEN ADMIN →</button>
    </form>

    <div class="secure">🔒 ДОСТУП ТОЛЬКО АВТОРИЗОВАННЫМ АДМИНИСТРАТОРАМ · <b>SECURE</b></div>
    <a class="back" href="/">← Вернуться на главную</a>
  </main>
</body>
</html>
