<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Protogen Admin — Вход</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        *{box-sizing:border-box}
        html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif}
        body.admin-login-page{
            min-height:100vh;
            color:#efffff;
            display:grid;
            place-items:center;
            overflow:hidden;
            position:relative;
            background:
                linear-gradient(180deg,rgba(1,5,8,.72),rgba(1,5,8,.88)),
                url("{{ url_for('static', filename='bg.png') }}") center/cover fixed;
        }
        body.admin-login-page:before{
            content:"";position:fixed;inset:0;pointer-events:none;
            background:
                radial-gradient(circle at 50% 42%,rgba(0,255,225,.11),transparent 28%),
                radial-gradient(circle at 20% 80%,rgba(151,52,255,.15),transparent 30%);
        }
        .login-noise{
            position:fixed;inset:0;pointer-events:none;opacity:.18;
            background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                             linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
            background-size:42px 42px;
            mask-image:linear-gradient(to bottom,black,transparent 85%);
        }
        .login-card{
            width:min(455px,calc(100vw - 32px));
            position:relative;
            padding:34px;
            border:1px solid rgba(0,255,225,.45);
            border-radius:25px;
            background:linear-gradient(145deg,rgba(4,15,19,.92),rgba(2,7,12,.9));
            box-shadow:0 0 0 1px rgba(255,255,255,.025) inset,
                       0 0 50px rgba(0,255,225,.13),
                       0 30px 100px rgba(0,0,0,.55);
            backdrop-filter:blur(20px);
        }
        .login-card:before{
            content:"";position:absolute;left:22px;right:22px;top:0;height:1px;
            background:linear-gradient(90deg,transparent,#00ffe1,transparent);
            box-shadow:0 0 15px #00ffe1;
        }
        .login-brand{display:flex;align-items:center;gap:14px;margin-bottom:27px}
        .login-avatar{
            width:58px;height:58px;border-radius:18px;overflow:hidden;
            border:1px solid #00ffe1;
            box-shadow:0 0 25px rgba(0,255,225,.2);
            background:#030b0e;
        }
        .login-avatar img{width:100%;height:100%;object-fit:cover}
        .login-kicker{font-size:10px;letter-spacing:2.6px;color:#00ffe1;font-weight:800}
        .login-status{font-size:10px;color:#6e898b;margin-top:5px}
        .login-status i{
            display:inline-block;width:6px;height:6px;border-radius:50%;
            background:#00ff9c;box-shadow:0 0 9px #00ff9c;margin-right:5px
        }
        .login-card h1{font-size:34px;letter-spacing:-1px;margin:0 0 8px}
        .login-subtitle{color:#789091;font-size:13px;margin:0 0 25px}
        .login-error{
            border:1px solid rgba(255,77,110,.42);
            background:rgba(104,18,37,.22);
            color:#ff9bac;border-radius:12px;padding:12px 13px;
            font-size:12px;line-height:1.4;margin-bottom:18px
        }
        .login-field{display:block;margin-bottom:16px}
        .login-field span{
            display:block;color:#9aafb0;font-size:11px;font-weight:700;
            letter-spacing:.5px;margin-bottom:7px
        }
        .login-field input{
            width:100%;height:48px;padding:0 14px;border-radius:12px;
            border:1px solid #183538;background:#061013;color:#efffff;
            outline:none;font-size:14px;transition:.2s
        }
        .login-field input::placeholder{color:#496263}
        .login-field input:focus{
            border-color:#00ffe1;
            box-shadow:0 0 0 3px rgba(0,255,225,.07),0 0 20px rgba(0,255,225,.08)
        }
        .login-submit{
            width:100%;height:50px;border:0;border-radius:12px;
            margin-top:4px;background:#00ffe1;color:#00110f;
            font-size:13px;font-weight:900;cursor:pointer;
            box-shadow:0 0 25px rgba(0,255,225,.15);
            transition:.2s
        }
        .login-submit:hover{transform:translateY(-1px);box-shadow:0 0 32px rgba(0,255,225,.28)}
        .login-submit:active{transform:translateY(0)}
        .login-submit b{float:right;margin-right:14px;font-size:17px}
        .login-back{
            display:block;margin-top:20px;color:#718889;text-decoration:none;
            font-size:11px
        }
        .login-back:hover{color:#00ffe1}
        .login-footer{
            position:fixed;bottom:14px;left:0;right:0;text-align:center;
            color:#385355;font-size:8px;letter-spacing:1.7px
        }
        @media(max-width:520px){
            .login-card{padding:26px 22px;border-radius:20px}
            .login-card h1{font-size:29px}
        }
    </style>
</head>
<body class="admin-login-page">
    <div class="login-noise"></div>

    <main class="login-card">
        <div class="login-brand">
            <div class="login-avatar">
                <img src="{{ url_for('static', filename='my_avatar.gif') }}" alt="Protogen">
            </div>
            <div>
                <div class="login-kicker">PROTOGEN ADMIN</div>
                <div class="login-status"><i></i> secure administration console</div>
            </div>
        </div>

        <h1>Вход в систему</h1>
        <p class="login-subtitle">Закрытая панель управления ботом</p>

        {% if error %}
        <div class="login-error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="post" autocomplete="on">
            <label class="login-field">
                <span>ЛОГИН</span>
                <input type="text" name="username" placeholder="Введите логин"
                       autocomplete="username" required autofocus>
            </label>

            <label class="login-field">
                <span>ПАРОЛЬ</span>
                <input type="password" name="password" placeholder="Введите пароль"
                       autocomplete="current-password" required>
            </label>

            <button class="login-submit" type="submit">
                Войти в панель <b>→</b>
            </button>
        </form>

        <a class="login-back" href="/">← Вернуться на сайт</a>
    </main>

    <div class="login-footer">THE SYSTEM_PROTOGEN // AUTHORIZED PERSONNEL ONLY</div>
</body>
</html>
