<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protogen Bot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="side-panel left">
    <div class="panel-title">SYSTEM</div>
    <div id="leftText" class="terminal-text"></div>
</div>

<div class="chat-container">
    <div class="chat-header">
        <img src="/static/my_avatar.gif" class="avatar">
        <div>
            <div class="name">Protogen Bot</div>
            <div class="status">● онлайн</div>
        </div>
    </div>

    <div class="messages" id="messages">
        <div class="message bot">
            Привет 👋 Я Protogen Bot.<br>
            Теперь у меня есть отдельная защищённая панель для администраторов.
        </div>
    </div>

    <div class="input-area">
        <input id="input" placeholder="Написать сообщение..." autocomplete="off">
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<div class="side-panel right">
    <div class="panel-title">LOGS</div>
    <div id="rightText" class="terminal-text"></div>
</div>

<a class="admin-entry" href="/admin/login">
    <span>🔐</span>
    <span>
        <b>Вход для админов</b>
        <small>Admin Console</small>
    </span>
    <strong>→</strong>
</a>

<script src="/static/script.js"></script>
</body>
</html>
