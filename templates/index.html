<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Protogen Bot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="chat-container">

    <div class="chat-header">
        <img src="/static/my_avatar.gif" class="avatar">
        <div>
            <b>Protogen Bot</b><br>
            <span class="status">онлайн</span>
        </div>
    </div>

    <div id="chat-box" class="chat-box">
        <div class="message bot">
            Привет 👋 Я Protogen Bot<br>
            Напиши "команды"
        </div>
    </div>

    <div class="chat-input">
        <input type="text" id="message" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">▶</button>
    </div>

</div>

<script src="/static/script.js"></script>
</body>
</html>
