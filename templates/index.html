<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Protogen AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="chat-container">

    <!-- ШАПКА -->
    <div class="header">
        <img src="/static/avatar.png" class="avatar">
        <div>
            <div class="title">Protogen Bot</div>
            <div class="status">онлайн</div>
        </div>
    </div>

    <!-- ЧАТ -->
    <div class="message bot">
    Привет 👋 Я Protogen Bot<br>
    Напиши "команды", чтобы узнать что я умею
</div>

    <!-- ВВОД -->
    <div class="input-area">
        <input type="text" id="message" placeholder="Написать сообщение...">
        <button onclick="sendMessage()">➤</button>
    </div>

</div>

<script>
async function sendMessage() {
    let input = document.getElementById("message");
    let text = input.value;

    if (!text) return;

    let chatBox = document.getElementById("chat-box");

    // сообщение пользователя
    chatBox.innerHTML += `<div class="message user">${text}</div>`;

    let response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: text})
    });

    let data = await response.json();

    // ответ бота
    chatBox.innerHTML += `<div class="message bot">${data.response}</div>`;

    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
