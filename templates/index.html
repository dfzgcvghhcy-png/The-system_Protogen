<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Protogen Bot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ЛЕВАЯ ПАНЕЛЬ -->
<div class="side-panel left">
    <div class="panel-title">SYSTEM</div>
    <div id="leftText" class="terminal-text"></div>
</div>

<!-- ПРАВАЯ ПАНЕЛЬ -->
<div class="side-panel right">
    <div class="panel-title">LOGS</div>
    <div id="rightText" class="terminal-text"></div>
</div>

<!-- ЧАТ -->
<div class="chat-container">

    <div class="chat-header">
        <img src="/static/my_avatar.gif" class="avatar">
        <div>
            <h3>Protogen Bot</h3>
            <span>онлайн</span>
        </div>
    </div>

    <div class="chat-messages" id="messages">
        <div class="message bot">
            Привет 👋 Я Protogen Bot<br>
            Напиши "команды"
        </div>
    </div>

    <div class="chat-input">
        <input type="text" id="input" placeholder="Написать сообщение...">
        <button onclick="sendMessage()">▶</button>
    </div>

</div>

<script src="/static/script.js"></script>
</body>
</html>
