<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Protogen Bot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ЛЕВАЯ ПАНЕЛЬ -->
<div class="side-panel left">
    <div class="panel-title">SYSTEM</div>
    <div id="leftText" class="terminal-text"></div>
</div>

<!-- ЧАТ -->
<div class="chat-container">
    <div class="chat-header">
        <img src="my_avatar.gif" class="avatar">
        <div>
            <div class="name">Protogen Bot</div>
            <div class="status">онлайн</div>
        </div>
    </div>

    <div class="messages" id="messages">
        <div class="message bot">
            Привет 👋 Я Protogen Bot<br>
            Напиши "команды"
        </div>
    </div>

    <div class="input-area">
        <input id="input" placeholder="Написать сообщение...">
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<!-- ПРАВАЯ ПАНЕЛЬ -->
<div class="side-panel right">
    <div class="panel-title">LOGS</div>
    <div id="rightText" class="terminal-text"></div>
</div>

<script src="script.js"></script>
</body>
</html>
